name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npm test
      - run: dotnet build src/DriveIt.Revit -c Release
