name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/**']

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # id-token: write only because _build.yml's job declares it for tag signing, and GitHub checks
    # a called workflow's permissions against the caller's before any `if`. This workflow never
    # signs: it passes no `sign`, so the job names no environment and runs no login step.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_build.yml
