name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/**']

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/_build.yml
